<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pretext — Interactive Text Layout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; cursor: none; }
    canvas { display: block; }
    #text-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    #hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.25);
      font: 12px/1 system-ui, sans-serif;
      letter-spacing: 0.08em;
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <canvas id="text-overlay"></canvas>
  <div id="hint">move cursor — text reflows · switch themes in the panel</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
